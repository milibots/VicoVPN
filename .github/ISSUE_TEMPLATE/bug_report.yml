name: Bug report
description: Report a reproducible problem in VicoVPN
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve VicoVPN. Do not include VPN keys,
        subscription tokens, private server addresses, or keystore data.

  - type: input
    id: version
    attributes:
      label: App version
      description: Release tag, commit, or APK version.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build type
      options:
        - GitHub release APK
        - GitHub Actions debug artifact
        - Local debug build
        - Local release build
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the app
        2. Select...
        3. Tap...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove keys, tokens, addresses, and personal data before posting.
      render: shell
