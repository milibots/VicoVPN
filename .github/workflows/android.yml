name: Android build
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch pinned Xray AAR
        run: bash scripts/bootstrap-native.sh
      - name: Unit tests and debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Android lint (non-blocking)
        continue-on-error: true
        shell: bash
        run: gradle --no-daemon lintDebug

      - uses: actions/upload-artifact@v7
        with:
          name: VicoVPN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
