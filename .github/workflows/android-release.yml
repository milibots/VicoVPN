name: Android Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v0.1.0"

      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        type: boolean
        default: false

      draft:
        description: "Create the release as a draft"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK assets
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
          fi

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VERSION}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build and test debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            clean \
            testDebugUnitTest \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Run Android lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew lintDebug --stacktrace --no-daemon

      - name: Prepare debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [[ -z "${DEBUG_APK}" ]]; then
            echo "Debug APK was not found."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          cp "${DEBUG_APK}" "dist/VicoVPN-${{ steps.version.outputs.version }}-debug.apk"

      - name: Build and sign production release APK
        id: signed_release
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]] ||
             [[ -z "${ANDROID_KEYSTORE_PASSWORD}" ]] ||
             [[ -z "${ANDROID_KEY_ALIAS}" ]] ||
             [[ -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Signing secrets are incomplete."
            echo "The installable debug APK will still be published."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          KEYSTORE_PATH="${RUNNER_TEMP}/vicovpn-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"

          if [[ ! -s "${KEYSTORE_PATH}" ]]; then
            echo "Decoded keystore file is empty."
            exit 1
          fi

          ./gradlew assembleRelease --stacktrace --no-daemon

          UNSIGNED_APK="$(find app/build/outputs/apk/release -type f \( -name '*-unsigned.apk' -o -name '*release*.apk' \) | head -n 1)"
          if [[ -z "${UNSIGNED_APK}" ]]; then
            echo "Release APK was not found."
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ -z "${BUILD_TOOLS}" ]]; then
            echo "Android build-tools were not found."
            exit 1
          fi

          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          [[ -x "${ZIPALIGN}" ]] || { echo "zipalign was not found at ${ZIPALIGN}"; exit 1; }
          [[ -x "${APKSIGNER}" ]] || { echo "apksigner was not found at ${APKSIGNER}"; exit 1; }

          ALIGNED_APK="${RUNNER_TEMP}/VicoVPN-aligned.apk"
          SIGNED_APK="dist/VicoVPN-${{ steps.version.outputs.version }}.apk"

          "${ZIPALIGN}" -p -f 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          "${APKSIGNER}" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"
          "${APKSIGNER}" verify --verbose --print-certs "${SIGNED_APK}"
          echo "created=true" >> "${GITHUB_OUTPUT}"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G "dist/*.apk" > /dev/null; then
            echo "No APK files exist in dist."
            exit 1
          fi
          (cd dist && sha256sum *.apk > checksums-sha256.txt)
          cat dist/checksums-sha256.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VicoVPN-${{ steps.version.outputs.version }}
          path: |
            dist/*.apk
            dist/checksums-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MANUAL_DRAFT: ${{ inputs.draft }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${MANUAL_DRAFT}" == "true" ]] && EXTRA_FLAGS+=(--draft)
            [[ "${MANUAL_PRERELEASE}" == "true" ]] && EXTRA_FLAGS+=(--prerelease)
          fi

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/* --clobber
          else
            gh release create \
              "${VERSION}" \
              dist/* \
              --title "VicoVPN ${VERSION}" \
              --generate-notes \
              --target "${GITHUB_SHA}" \
              "${EXTRA_FLAGS[@]}"
          fi
